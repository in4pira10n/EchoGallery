# EchoGallery default player keymap
# The file can be overridden by ZXCWASD.conf next to the executable.
x cycle pause
c seek 5
z seek -5
w add volume 5
s add volume -5
m cycle mute
f cycle fullscreen
ESC set fullscreen no
SPACE cycle pause
a playlist-prev
d playlist-next

# Additional IINA / system-player bindings
Alt+RIGHT frame-step
Alt+LEFT frame-back-step
Alt+UP add volume 1
Alt+DOWN add volume -1
Meta+/ cycle mute
Ctrl+Meta+f cycle fullscreen
Ctrl+Meta+t cycle ontop
Meta+s screenshot
Meta+l ab-loop
Meta+L cycle-values loop "inf" "no"
Shift+LEFT sub-seek -1
Shift+RIGHT sub-seek 1
Shift+PGUP seek 600
Shift+PGDWN seek -600
ENTER set fullscreen yes
p cycle pause
. frame-step
, frame-back-step
E cycle edition
POWER quit
PLAY cycle pause
PAUSE cycle pause
PLAYPAUSE cycle pause
STOP quit
FORWARD seek 60
REWIND seek -60
NEXT playlist-next
PREV playlist-prev
VOLUME_UP add volume 2
VOLUME_DOWN add volume -2
MUTE cycle mute
CLOSE_WIN quit
2 set speed 1.25
5 set speed 1.5
0 set speed 1.0
Z seek -30
C seek 30
