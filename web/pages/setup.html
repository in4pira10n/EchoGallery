<!doctype html>
<html lang="zh-CN" data-theme="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1976d2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EchoGallery">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title></title>
  <link rel="manifest" href="/manifest.webmanifest?v={{ASSET_VERSION}}">
  <link rel="icon" href="/static/pwa-icon.png?v={{ASSET_VERSION}}" type="image/png">
  <link rel="apple-touch-icon" href="/static/pwa-icon.png?v={{ASSET_VERSION}}">
  <link rel="stylesheet" href="/pages/common.css?v={{ASSET_VERSION}}">
  <link rel="stylesheet" href="/pages/app.css?v={{ASSET_VERSION}}">
  <link rel="stylesheet" href="/pages/login.css?v={{ASSET_VERSION}}">
  <link rel="stylesheet" href="/pages/setup.css?v={{ASSET_VERSION}}">
  <script src="/static/i18n.js?v={{ASSET_VERSION}}"></script>
  <script src="/static/pwa.js?v={{ASSET_VERSION}}" defer></script>
</head>
<body>
<script>
  (function(){
    var t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    window.__SETUP__ = __SETUP_PAYLOAD__;
  })();
</script>
<div class="login-wrap">
  <div class="login-card setup-card" id="setup-root"></div>
</div>
<script>
(function () {
  var state = window.__SETUP__ || {};
  var root = document.getElementById('setup-root');
  var copy = {};

  function esc(text) {
    return String(text || '').replace(/[&<>"]/g, function (m) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];
    });
  }

  function bindSpotlight(selector, xVar, yVar) {
    var el = document.querySelector(selector);
    if (!el || !window.matchMedia('(pointer: fine)').matches) return;
    var frame = 0;
    function move(e) {
      if (frame) cancelAnimationFrame(frame);
      frame = requestAnimationFrame(function () {
        var rect = el.getBoundingClientRect();
        var x = Math.max(0, Math.min(100, (e.clientX - rect.left) / rect.width * 100));
        var y = Math.max(0, Math.min(100, (e.clientY - rect.top) / rect.height * 100));
        el.style.setProperty(xVar, x.toFixed(2) + '%');
        el.style.setProperty(yVar, y.toFixed(2) + '%');
      });
    }
    el.addEventListener('pointermove', move);
  }

  function mergeCopy(target, source) {
    if (!source || typeof source !== 'object') return target;
    Object.keys(source).forEach(function (key) {
      var value = source[key];
      if (value && typeof value === 'object' && !Array.isArray(value)) {
        if (!target[key] || typeof target[key] !== 'object' || Array.isArray(target[key])) {
          target[key] = {};
        }
        mergeCopy(target[key], value);
        return;
      }
      target[key] = value;
    });
    return target;
  }

  function text(path, params) {
    var current = copy;
    String(path || '').split('.').forEach(function (segment) {
      if (current && typeof current === 'object' && segment in current) current = current[segment];
      else current = undefined;
    });
    var value = typeof current === 'string' ? current : '';
    return String(value || '').replace(/\{(\w+)\}/g, function (_, key) {
      return params && key in params ? String(params[key]) : '{' + key + '}';
    });
  }

  function responseText(payload, field, fallback) {
    var key = payload && payload[field + '_key'];
    var params = payload && payload[field + '_params'];
    var localized = key && window.EchoGalleryI18n && window.EchoGalleryI18n.text(key, params || {});
    return localized || (payload && payload[field]) || fallback || '';
  }

  function renderButtonBusySpinner() {
    return '<span class="button-busy-inline" aria-hidden="true"><span class="button-busy-spinner"></span></span>';
  }

  function renderInit() {
    document.body.className = 'register-page setup-init-page';
    root.className = 'login-card setup-card setup-init-card';
    var libraries = (state.libraries || []).length ? state.libraries : [{name:text('init.libraryName', { index: 1 }), path:''}];
    root.innerHTML =
      '<section class="login-form-panel setup-init-panel" aria-label="' + esc(text('init.panelLabel')) + '">' +
        '<div class="auth-brand"><img src="/static/pwa-icon.png?v={{ASSET_VERSION}}" alt=""><p><span id="setup-gallery-title">' + esc(text('init.galleryNameDefault')) + '</span> <b>' + esc(text('init.brandSuffix')) + '</b></p></div>' +
        '<div class="setup-init-section"><div class="setup-init-section-head"><strong>' + esc(text('init.galleryNameTitle')) + '</strong></div>' +
          '<div class="auth-fields"><div class="auth-field"><label for="setup-app-name">' + esc(text('init.galleryNameLabel')) + '</label><input id="setup-app-name" type="text" maxlength="80" placeholder="' + esc(text('init.galleryNameDefault')) + '" value="' + esc(state.app_name || text('init.galleryNameDefault')) + '"></div></div>' +
          '<p class="setup-desc">' + esc(text('init.galleryNameCopy')) + '</p></div>' +
        '<div class="setup-init-section">' +
          '<div class="setup-init-section-head"><strong>' + esc(text('init.serviceTitle')) + '</strong></div>' +
          '<div class="form-group"><label class="form-label" for="setup-port">' + esc(text('init.portLabel')) + '</label><input class="input" id="setup-port" type="number" min="1" max="65535" value="' + (state.port || 8080) + '"></div>' +
          '<p class="setup-desc">' + esc(text('init.serviceCopy')) + '</p>' +
        '</div>' +
        '<div class="setup-init-section"><div class="setup-init-section-head"><strong>' + esc(text('init.accountTitle')) + '</strong></div>' +
          '<div class="auth-fields"><div class="auth-field"><label for="setup-username">' + esc(text('init.usernameLabel')) + '</label><input id="setup-username" type="text" autocomplete="username" placeholder="' + esc(text('init.usernamePlaceholder')) + '" value="admin"></div>' +
          '<div class="auth-field"><label for="setup-password">' + esc(text('init.passwordLabel')) + '</label><input id="setup-password" type="password" autocomplete="new-password" placeholder="' + esc(text('init.passwordPlaceholder')) + '"></div></div>' +
          '<p class="setup-desc">' + esc(text('init.accountCopy')) + '</p>' +
        '</div>' +
        '<div class="setup-init-section">' +
          '<div class="setup-init-section-head"><strong>' + esc(text('init.libraryTitle')) + '</strong></div>' +
          '<div id="setup-libraries" class="setup-init-libraries"></div>' +
          '<p class="setup-desc">' + esc(text('init.libraryCopy')) + '</p>' +
        '</div>' +
        '<div class="settings-actions settings-actions-fill">' +
          '<button class="btn" id="setup-import-transfer" type="button"><img src="/static/svg/down.svg" alt="" aria-hidden="true">' + esc(text('init.importTransfer')) + '</button>' +
          '<input id="setup-import-transfer-file" type="file" accept=".zip,application/zip" hidden>' +
        '</div>' +
        '<button class="timeline-order-btn" id="setup-submit" aria-label="' + esc(text('init.save')) + '" title="' + esc(text('init.save')) + '"><img src="/static/svg/check.svg" width="24" height="24" alt=""></button>' +
        '<a class="timeline-order-btn" href="/login" id="setup-switch-user" aria-label="' + esc(text('init.backToLogin')) + '" title="' + esc(text('init.backToLogin')) + '"><img src="/static/svg/back.svg" width="24" height="24" alt=""></a>' +
        '<div class="login-error" id="setup-error"></div>' +
      '</section>';
    Array.prototype.forEach.call(root.querySelectorAll('.form-group'), function (group) {
      group.className = 'auth-fields';
      var field = document.createElement('div');
      field.className = 'auth-field';
      while (group.firstChild) field.appendChild(group.firstChild);
      group.appendChild(field);
      var input = field.querySelector('input');
      input.classList.remove('input');
      input.placeholder = input.placeholder || field.querySelector('label').textContent;
    });
    document.getElementById('setup-app-name').addEventListener('input', function () {
      var name = this.value.trim() || text('init.galleryNameDefault');
      document.getElementById('setup-gallery-title').textContent = name;
      document.title = text('init.pageTitle', { name: name });
    });
    document.title = text('init.pageTitle', { name: document.getElementById('setup-app-name').value.trim() || text('init.galleryNameDefault') });
    var list = document.getElementById('setup-libraries');

    function renderLibraries(items) {
      list.innerHTML = items.map(function (library, index) {
        return '<div class="setup-library-row">' +
          '<div class="auth-fields"><div class="auth-field"><input class="setup-library-name" aria-label="' + esc(text('init.namePlaceholder')) + '" type="text" maxlength="32" placeholder="' + esc(text('init.namePlaceholder')) + '" value="' + esc(library.name || text('init.libraryName', { index: index + 1 })) + '"></div>' +
          '<div class="auth-field"><input class="setup-library-path" aria-label="' + esc(text('init.pathPlaceholder')) + '" type="text" placeholder="' + esc(text('init.pathPlaceholder')) + '" value="' + esc(library.path || '') + '"></div></div>' +
        '</div>';
      }).join('');
    }

    renderLibraries(libraries.slice(0, 1));

    document.getElementById('setup-import-transfer').addEventListener('click', function () {
      document.getElementById('setup-import-transfer-file').click();
    });
    document.getElementById('setup-import-transfer-file').addEventListener('change', async function () {
      var file = this.files && this.files[0];
      if (!file) return;
      var btn = document.getElementById('setup-import-transfer');
      var errorEl = document.getElementById('setup-error');
      btn.disabled = true;
      btn.innerHTML = renderButtonBusySpinner();
      btn.setAttribute('aria-label', text('init.importingTransfer'));
      errorEl.textContent = '';
      try {
        var form = new FormData();
        form.append('file', file);
        var resp = await fetch('/api/setup/import', {method:'POST', body:form});
        var data = await resp.json();
        if (!resp.ok) throw new Error(responseText(data, 'error', text('init.importFailed')));
        var browser = data.browser_settings;
        var allowed = ['echogallery_pwa_settings_v1','echogallery_media_kind_filter_v1','echogallery_timeline_order_v1','echogallery_album_detail_sort_v1','echogallery_global_video_volume_v1','echogallery_library_batch_workflow_enabled_v1','echogallery_library_batch_workflow_aggressive_v1','echogallery_sidebar_compact'];
        if (browser && typeof browser === 'object') allowed.forEach(function (key) {
          if (typeof browser[key] === 'string') localStorage.setItem(key, browser[key]);
        });
        btn.textContent = text('init.restarting');
        setTimeout(function () { location.href = '/login'; }, 1800);
      } catch (err) {
        errorEl.textContent = err.message || String(err);
        btn.disabled = false;
        btn.textContent = text('init.importTransfer');
      } finally {
        this.value = '';
      }
    });

    document.getElementById('setup-submit').addEventListener('click', async function () {
      var errorEl = document.getElementById('setup-error');
      errorEl.textContent = '';
      var rows = Array.prototype.map.call(list.querySelectorAll('.setup-library-row'), function (row, index) {
        return {
          name: row.querySelector('.setup-library-name').value.trim() || text('init.libraryName', { index: index + 1 }),
          path: row.querySelector('.setup-library-path').value.trim()
        };
      }).filter(function (item) { return item.path; });
      if (!rows.length) {
        errorEl.textContent = text('init.missingLibrary');
        return;
      }
      var btn = this;
      var originalContent = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = renderButtonBusySpinner();
      btn.setAttribute('aria-label', text('init.saving'));
      try {
        var resp = await fetch('/api/setup/init', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            app_name: document.getElementById('setup-app-name').value.trim() || text('init.galleryNameDefault'),
            port: parseInt(document.getElementById('setup-port').value, 10) || 8080,
            libraries: rows,
            storage_path: rows[0].path,
            username: document.getElementById('setup-username').value.trim(),
            password: document.getElementById('setup-password').value
          })
        });
        var data = await resp.json();
        if (!resp.ok) throw new Error(responseText(data, 'error', text('init.initializationFailed')));
        btn.innerHTML = renderButtonBusySpinner();
        btn.setAttribute('aria-label', text('init.restarting'));
        errorEl.style.color = 'var(--accent)';
        errorEl.textContent = responseText(data, 'message', text('init.restarting'));
        setTimeout(function () { location.reload(); }, 2000);
      } catch (e) {
        btn.disabled = false;
        btn.innerHTML = originalContent;
        btn.setAttribute('aria-label', text('init.save'));
        errorEl.style.color = 'var(--danger)';
        errorEl.textContent = e.message || text('init.initializationFailed');
      }
    });
    document.getElementById('setup-switch-user').addEventListener('click', async function (event) {
      event.preventDefault();
      try {
        await fetch('/api/auth/logout', { method: 'POST' });
      } catch (e) {}
      location.href = '/login';
    });
  }

  function renderRecovery() {
    document.title = text('recovery.pageTitle');
    root.className = 'login-card setup-card setup-recovery-card';
    var recoveryLibraries = (state.libraries || []).map(function (library, index) {
      return {
        id: library.id || '',
        name: library.name || text('recovery.libraryName', { index: index + 1 }),
        path: library.path || ''
      };
    });
    root.innerHTML =
      '<div class="setup-recovery-hero">' +
        '<div class="setup-recovery-brand"><img class="setup-recovery-mark" src="/static/pwa-icon.png?v={{ASSET_VERSION}}" alt=""><span>' + esc(state.app_name || text('init.galleryNameDefault')) + '</span></div>' +
        '<span class="setup-recovery-status">' + esc(text('recovery.status')) + '</span>' +
        '<h1>' + esc(text('recovery.title')) + '</h1>' +
        '<p>' + esc(state.message || text('recovery.message')) + '</p>' +
        '<div class="setup-recovery-current"><span>' + esc(text('recovery.currentPath')) + '</span><strong>' + esc(state.current_storage_path || text('recovery.unknownPath')) + '</strong></div>' +
      '</div>' +
      '<div class="setup-recovery-grid">' +
        '<section class="setup-recovery-section">' +
          '<div class="setup-recovery-section-head"><strong>' + esc(text('recovery.existingTitle')) + '</strong><span>' + esc(text('recovery.existingCount', { count: recoveryLibraries.length })) + '</span></div>' +
          '<div class="setup-library-chooser" id="setup-library-chooser">' + (recoveryLibraries.length ? recoveryLibraries.map(function (library, index) {
            var currentClass = library.path === state.current_storage_path ? ' current' : '';
            var current = library.path === state.current_storage_path ? '<em>' + esc(text('recovery.currentInvalid')) + '</em>' : '';
            return '<div class="setup-library-option setup-library-edit-option' + currentClass + '" data-index="' + index + '">' +
              '<span class="setup-library-option-dot">' + (index + 1) + '</span>' +
              '<span class="setup-library-option-main">' +
                '<strong>' + esc(library.name || library.path) + '</strong>' +
                '<small>' + esc(library.path) + '</small>' +
              '</span>' +
              current +
            '</div>';
          }).join('') : '<div class="setup-recovery-empty">' + esc(text('recovery.empty')) + '</div>') + '</div>' +
        '</section>' +
        '<section class="setup-recovery-section setup-recovery-create" id="setup-recovery-editor">' +
        '</section>' +
      '</div>' +
      '<div class="setup-recovery-footer">' +
        '<button class="btn btn-primary" id="setup-select-library">' + esc(text('recovery.select')) + '</button>' +
        '<div class="login-error" id="setup-error"></div>' +
      '</div>';

    var selectedIndex = -1;
    function renderRecoveryEditor() {
      var editor = document.getElementById('setup-recovery-editor');
      if (!editor) return;
      var editing = selectedIndex >= 0 && selectedIndex < recoveryLibraries.length;
      var library = editing ? recoveryLibraries[selectedIndex] : {};
      editor.innerHTML =
        '<div class="setup-recovery-section-head"><strong>' + esc(editing ? text('recovery.editTitle') : text('recovery.createTitle')) + '</strong><span>' + esc(editing ? text('recovery.editHint') : text('recovery.createHint')) + '</span></div>' +
        '<div class="form-group"><label class="form-label" for="setup-new-library-name">' + esc(text('recovery.newNameLabel')) + '</label><input class="input" id="setup-new-library-name" type="text" value="' + esc(library.name || '') + '" placeholder="' + esc(text('recovery.newNamePlaceholder')) + '"></div>' +
        '<div class="form-group"><label class="form-label" for="setup-new-library-path">' + esc(text('recovery.newPathLabel')) + '</label><input class="input" id="setup-new-library-path" type="text" value="' + esc(library.path || '') + '" placeholder="' + esc(text('recovery.newPathPlaceholder')) + '"></div>';
    }
    function syncRecoveryEditor() {
      if (selectedIndex < 0 || selectedIndex >= recoveryLibraries.length) return;
      recoveryLibraries[selectedIndex] = {
        name: document.getElementById('setup-new-library-name').value.trim() || text('recovery.libraryName', { index: selectedIndex + 1 }),
        path: document.getElementById('setup-new-library-path').value.trim()
      };
    }
    renderRecoveryEditor();
    document.getElementById('setup-library-chooser').addEventListener('click', function (event) {
      if (event.target !== this) return;
      syncRecoveryEditor();
      selectedIndex = -1;
      Array.prototype.forEach.call(document.querySelectorAll('.setup-library-option'), function (item) {
        item.classList.remove('active');
      });
      renderRecoveryEditor();
    });
    Array.prototype.forEach.call(document.querySelectorAll('.setup-library-edit-option'), function (row) {
      row.addEventListener('click', function () {
        syncRecoveryEditor();
        selectedIndex = Number(row.getAttribute('data-index'));
        Array.prototype.forEach.call(document.querySelectorAll('.setup-library-option'), function (item) {
          item.classList.toggle('active', item === row);
        });
        renderRecoveryEditor();
      });
    });
    function collectRecoveryLibraries() {
      syncRecoveryEditor();
      return recoveryLibraries.map(function (library, index) {
        return {
          id: library.id || '',
          name: library.name || text('recovery.libraryName', { index: index + 1 }),
          path: library.path || ''
        };
      });
    }

    document.getElementById('setup-select-library').addEventListener('click', async function () {
      var errorEl = document.getElementById('setup-error');
      errorEl.textContent = '';
      var editedLibraries = collectRecoveryLibraries();
      var newName = document.getElementById('setup-new-library-name').value.trim();
      var newPath = document.getElementById('setup-new-library-path').value.trim();
      var selectedLibrary = selectedIndex >= 0 ? editedLibraries[selectedIndex] : null;
      var targetPath = newPath || (selectedLibrary && selectedLibrary.path) || '';
      if (!targetPath) {
        errorEl.textContent = text('recovery.missingTarget');
        return;
      }
      var btn = this;
      btn.disabled = true;
      btn.innerHTML = renderButtonBusySpinner();
      btn.setAttribute('aria-label', text('recovery.switching'));
      try {
        var resp = await fetch('/api/setup/select-library', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({name: newName, storage_path: targetPath, selected_index: selectedIndex, libraries: editedLibraries})
        });
        var data = await resp.json();
        if (!resp.ok) throw new Error(responseText(data, 'error', text('recovery.switchFailed')));
        btn.innerHTML = renderButtonBusySpinner();
        btn.setAttribute('aria-label', text('recovery.restarting'));
        errorEl.style.color = 'var(--accent)';
        errorEl.textContent = responseText(data, 'message', text('recovery.serviceRestarting'));
        setTimeout(function () { location.reload(); }, 2000);
      } catch (e) {
        btn.disabled = false;
        btn.textContent = text('recovery.select');
        btn.removeAttribute('aria-label');
        errorEl.style.color = 'var(--danger)';
        errorEl.textContent = e.message || text('recovery.switchFailed');
      }
    });
  }

  window.EchoGalleryI18n.load()
    .then(function (catalog) {
      if (catalog && catalog.pages && catalog.pages.setup) {
        mergeCopy(copy, catalog.pages.setup);
      }
    })
    .catch(function () {})
    .finally(function () {
      if (state.mode === 'library_recovery') renderRecovery();
      else renderInit();
    });
})();
</script>
</body>
</html>
