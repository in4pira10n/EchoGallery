<!doctype html>
<html lang="zh-CN" data-theme>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1976d2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="EchoGallery">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title id="login-page-title">登录 - EchoGallery</title>
    <link rel="manifest" href="/manifest.webmanifest?v={{ASSET_VERSION}}">
    <link rel="icon" href="/static/pwa-icon.png?v={{ASSET_VERSION}}" type="image/png">
    <link rel="apple-touch-icon" href="/static/pwa-icon.png?v={{ASSET_VERSION}}">
    <link rel="stylesheet" href="/pages/common.css?v={{ASSET_VERSION}}">
    <link rel="stylesheet" href="/pages/app.css?v={{ASSET_VERSION}}">
    <link rel="stylesheet" href="/pages/login.css?v={{ASSET_VERSION}}">
    <script src="/static/pwa.js?v={{ASSET_VERSION}}" defer></script>
  </head>
  <body class="login-page">
    <script>
  (function(){
    var t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
    <script>
  (function() {
    function blockViewportZoom(event) { event.preventDefault(); }
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function(type) {
      document.addEventListener(type, blockViewportZoom, { passive: false });
    });
    document.addEventListener('touchmove', function(event) {
      if (event.touches && event.touches.length > 1) event.preventDefault();
    }, { passive: false });
    document.addEventListener('dblclick', function(event) {
      if (event.target.closest('.auth-screen, .timeline-order-btn')) event.preventDefault();
    }, { passive: false });
    document.addEventListener('wheel', function(event) {
      if (event.ctrlKey) event.preventDefault();
    }, { passive: false });
  })();
</script>
    <main class="auth-screen">
      <section class="auth-stage" aria-hidden="true"></section>
      <section class="auth-pane" aria-label="登录">
        <div class="auth-brand">
          <img id="login-library-avatar" src="/static/pwa-icon.png" alt="">
          <p>Welcome to <strong id="login-library-name">EchoGallery</strong></p>
        </div>
        <div class="auth-fields">
          <div class="auth-field">
            <label for="username" id="login-username-label">用户名</label>
            <input id="username" type="text" autocomplete="username" placeholder="Account">
          </div>
          <div class="auth-field">
            <label for="password" id="login-password-label">密码</label>
            <input id="password" type="password" autocomplete="current-password" placeholder="Password">
          </div>
        </div>
        <div class="login-error" id="login-error"></div>
      </section>
    </main>
    <a class="timeline-order-btn" id="register-btn" href="/register" aria-label="注册新用户" title="注册新用户">
      <svg data-icon-source width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><use href="/static/svg/register.svg#register-icon"></use></svg>

    </a>
    <button class="timeline-order-btn" id="login-btn" type="button" aria-label="登录" title="登录">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M10.3906 19.3828C9.97396 19.3828 9.61979 19.2031 9.32812 18.8438L5.28125 13.8594C5.16667 13.724 5.08333 13.5911 5.03125 13.4609C4.98438 13.3307 4.96094 13.1953 4.96094 13.0547C4.96094 12.7422 5.0651 12.4844 5.27344 12.2812C5.48177 12.0781 5.74479 11.9766 6.0625 11.9766C6.42188 11.9766 6.72396 12.1302 6.96875 12.4375L10.3594 16.7344L16.9766 6.25C17.112 6.04167 17.2526 5.89583 17.3984 5.8125C17.5443 5.72396 17.7266 5.67969 17.9453 5.67969C18.263 5.67969 18.5234 5.77865 18.7266 5.97656C18.9297 6.17448 19.0312 6.42708 19.0312 6.73438C19.0312 6.85938 19.0104 6.98438 18.9688 7.10938C18.9271 7.23438 18.862 7.36458 18.7734 7.5L11.4609 18.8125C11.2109 19.1927 10.8542 19.3828 10.3906 19.3828Z" fill="currentColor"/></svg>
    </button>
<script>
(function() {
  var systemThemeQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var copyDefaults = {
    pageTitle: '登录 - EchoGallery',
    heroTitle: '欢迎回来',
    heroCopy: '进入你的本地影像资源库，继续浏览、整理与回忆。',
    formTitle: '登录 EchoGallery',
    formNote: '使用你的本地账号继续进入当前资源库。',
    usernameLabel: '用户名',
    usernamePlaceholder: '请输入用户名',
    passwordLabel: '密码',
    passwordPlaceholder: '请输入密码',
    submit: '登录',
    registerLink: '注册新用户',
    panelFootnote: '所有数据仍保留在本地目录与当前实例中。',
    reasons: {
      duplicate: '该账号已在新页面登录，当前页面已退出',
      expired: '页面会话已过期，请重新登录',
      noLibrary: '当前没有可进入的资源库，请稍后再试'
    },
    errors: {
      missingFields: '请输入用户名和密码',
      network: '网络错误',
      failed: '登录失败'
    }
  };
  function applyCopy(remote) {
    var copy = Object.assign({}, copyDefaults, remote || {});
    if (copy.errors && copyDefaults.errors) {
      copy.errors = Object.assign({}, copyDefaults.errors, copy.errors);
    }
    document.title = copy.pageTitle || copyDefaults.pageTitle;
    var map = {
      'login-hero-title': copy.heroTitle,
      'login-hero-copy': copy.heroCopy,
      'login-form-title': copy.formTitle,
      'login-form-note': copy.formNote,
      'login-username-label': copy.usernameLabel,
      'login-password-label': copy.passwordLabel,
      'login-btn': copy.submit
    };
    Object.keys(map).forEach(function(id) {
      var node = document.getElementById(id);
      if (!node) return;
      if (id === 'login-btn') {
        node.setAttribute('aria-label', map[id]);
        node.setAttribute('title', map[id]);
        return;
      }
      node.textContent = map[id];
    });
    var username = document.getElementById('username');
    if (username) username.placeholder = copy.usernamePlaceholder || copyDefaults.usernamePlaceholder;
    var password = document.getElementById('password');
    if (password) password.placeholder = copy.passwordPlaceholder || copyDefaults.passwordPlaceholder;
    var registerLink = document.querySelector('.auth-recovery');
    if (registerLink) registerLink.textContent = copy.registerLink || copyDefaults.registerLink;
    var footnote = document.getElementById('login-panel-footnote');
    if (footnote) footnote.textContent = copy.panelFootnote || copyDefaults.panelFootnote;
    return copy;
  }
  var heroMottos = [
    { text: '千里之行，始于足下。', author: '老子' },
    { text: '学而时习之，不亦说乎？', author: '孔子' },
    { text: '行到水穷处，坐看云起时。', author: '王维' },
    { text: '长风破浪会有时，直挂云帆济沧海。', author: '李白' },
    { text: '不积跬步，无以至千里。', author: '荀子' },
    { text: '山重水复疑无路，柳暗花明又一村。', author: '陆游' },
    { text: 'Well done is better than well said.', author: 'Benjamin Franklin' },
    { text: 'Nothing will come of nothing.', author: 'William Shakespeare' },
    { text: 'I dwell in Possibility.', author: 'Emily Dickinson' },
    { text: 'A thing of beauty is a joy for ever.', author: 'John Keats' }
  ];
  // Preserve the stored identity so existing visitors still avoid repeat quotes.
  function mottoKey(motto) {
    return motto.text + ' (' + motto.author + ')';
  }
  var currentMotto = '';
  function showHeroMotto() {
    var node = document.getElementById('login-hero-summary-text');
    var authorNode = document.getElementById('login-hero-summary-author');
    if (!node || !authorNode) return;
    var previous = currentMotto;
    var key = 'echogallery_login_motto_v1';
    try {
      previous = localStorage.getItem(key) || previous;
    } catch (_) {}
    var choices = heroMottos.filter(function(motto) {
      return mottoKey(motto) !== previous && mottoKey(motto) !== currentMotto;
    });
    var selected = choices[Math.floor(Math.random() * choices.length)];
    currentMotto = mottoKey(selected);
    node.textContent = selected.text;
    authorNode.textContent = '—— ' + selected.author;
    try {
      localStorage.setItem(key, currentMotto);
    } catch (_) {}
  }
  showHeroMotto();
  var themeToggleBtn = document.getElementById('login-theme-toggle');
  var btn = document.getElementById('login-btn');
  var errEl = document.getElementById('login-error');
  var usernameInput = document.getElementById('username');
  var libraryAvatar = document.getElementById('login-library-avatar');
  var libraryName = document.getElementById('login-library-name');
  var libraryBrand = document.querySelector('.auth-brand');
  var defaultLibraryAvatar = libraryAvatar ? libraryAvatar.getAttribute('src') : '/static/pwa-icon.png';
  var libraryPreviewTimer = 0;
  var libraryPreviewController = null;
  var libraryPreviewUsername = '';
  function clearAccountLibraryPreview() {
    if (libraryName) libraryName.textContent = 'EchoGallery';
    if (libraryAvatar) {
      libraryAvatar.src = defaultLibraryAvatar;
      libraryAvatar.alt = '';
    }
    if (libraryBrand) libraryBrand.classList.remove('has-account-library', 'is-loading-account-library');
  }
  libraryAvatar && libraryAvatar.addEventListener('error', function() {
    if (libraryAvatar.src.indexOf(defaultLibraryAvatar) === -1) libraryAvatar.src = defaultLibraryAvatar;
  });
  function applyAccountLibraryPreview(payload, username) {
    if (username !== libraryPreviewUsername) return;
    var accountLibrary = payload && payload.account_library;
    var name = accountLibrary && String(accountLibrary.name || '').trim();
    if (!name) {
      clearAccountLibraryPreview();
      return;
    }
    var avatarURL = accountLibrary.avatar && String(accountLibrary.avatar.url || '').trim();
    if (libraryName) libraryName.textContent = name;
    if (libraryAvatar) {
      libraryAvatar.src = avatarURL.indexOf('/api/login/hero/avatar/') === 0 ? avatarURL : defaultLibraryAvatar;
      libraryAvatar.alt = name;
    }
    if (libraryBrand) libraryBrand.classList.add('has-account-library');
  }
  function loadAccountLibraryPreview() {
    var username = usernameInput ? usernameInput.value.trim() : '';
    libraryPreviewUsername = username;
    window.clearTimeout(libraryPreviewTimer);
    if (libraryPreviewController) libraryPreviewController.abort();
    if (!username) {
      clearAccountLibraryPreview();
      return;
    }
    libraryPreviewTimer = window.setTimeout(async function() {
      var controller = window.AbortController ? new AbortController() : null;
      libraryPreviewController = controller;
      if (libraryBrand) libraryBrand.classList.add('is-loading-account-library');
      try {
        var response = await fetch('/api/auth/account-library?username=' + encodeURIComponent(username), {
          cache: 'no-store',
          signal: controller ? controller.signal : undefined
        });
        var payload = response.ok ? await response.json() : null;
        applyAccountLibraryPreview(payload, username);
      } catch (error) {
        if ((!error || error.name !== 'AbortError') && username === libraryPreviewUsername) clearAccountLibraryPreview();
      } finally {
        if (username === libraryPreviewUsername && libraryBrand) libraryBrand.classList.remove('is-loading-account-library');
      }
    }, 260);
  }
  usernameInput && usernameInput.addEventListener('input', loadAccountLibraryPreview);
  usernameInput && usernameInput.addEventListener('blur', loadAccountLibraryPreview);
  function systemTheme() {
    return systemThemeQuery && systemThemeQuery.matches ? 'dark' : 'light';
  }
  function updateThemeToggleState() {
    if (!themeToggleBtn) return;
    themeToggleBtn.setAttribute('aria-pressed', document.documentElement.dataset.theme === 'dark' ? 'true' : 'false');
  }
  function setTheme(theme) {
    var next = theme === 'dark' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    updateThemeToggleState();
  }
  function toggleTheme() {
    setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  }
  function syncThemeWithSystem() {
    setTheme(systemTheme());
  }
  function ensurePageSessionID() {
    try {
      var key = 'echogallery_page_session_id_v1';
      var current = sessionStorage.getItem(key) || '';
      if (!current) {
        current = (window.crypto && typeof window.crypto.randomUUID === 'function')
          ? window.crypto.randomUUID()
          : ('eg-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12));
        sessionStorage.setItem(key, current);
      }
      return current;
    } catch (_) {
      return (window.crypto && typeof window.crypto.randomUUID === 'function')
        ? window.crypto.randomUUID()
        : ('eg-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12));
    }
  }
  function resetPageSessionID() {
    var next = (window.crypto && typeof window.crypto.randomUUID === 'function')
      ? window.crypto.randomUUID()
      : ('eg-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12));
    try {
      sessionStorage.setItem('echogallery_page_session_id_v1', next);
    } catch (_) {}
    return next;
  }
  function markPageSessionTransfer(sessionID) {
    try {
      sessionStorage.setItem('echogallery_page_session_transfer_v1', sessionID);
    } catch (_) {}
  }
  function loginReasonMessage(reason) {
    var reasons = (copy && copy.reasons) || copyDefaults.reasons;
    switch (String(reason || '').trim()) {
      case 'duplicate':
        return reasons.duplicate || '';
      case 'expired':
        return reasons.expired || '';
      case 'no-library':
      case 'no_accessible_library':
        return reasons.noLibrary || '';
      default:
        return '';
    }
  }
  var copy = applyCopy();
  fetch('/static/strings/zh-CN.json', { cache: 'no-store' })
    .then(function (response) { return response.ok ? response.json() : null; })
    .then(function (catalog) {
      if (catalog && catalog.pages && catalog.pages.login) {
        copy = applyCopy(catalog.pages.login);
      }
    })
    .catch(function () {});
  async function doLogin() {
    var u = document.getElementById('username').value.trim();
    var p = document.getElementById('password').value;
    if (!u || !p) { errEl.textContent = copy.errors.missingFields || copyDefaults.errors.missingFields; return; }
    btn.disabled = true; btn.setAttribute('aria-busy', 'true');
    var pageSessionID = resetPageSessionID();
    try {
      var r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-EG-Page-Session': pageSessionID
        },
        body: JSON.stringify({username: u, password: p})
      });
      var d = await r.json().catch(function () { return {}; });
      if (r.ok) {
        errEl.style.color = 'var(--accent)';
        errEl.textContent = d.message || '';
        markPageSessionTransfer(pageSessionID);
        var target = d.redirect || '/';
        var delay = Math.max(0, Number(d.delay_ms) || 0);
        setTimeout(function () { location.href = target; }, delay);
        return;
      }
      errEl.textContent = d.error || loginReasonMessage(d.reason) || copy.errors.failed || copyDefaults.errors.failed;
    } catch(e) { errEl.textContent = copy.errors.network || copyDefaults.errors.network; }
    btn.disabled = false; btn.removeAttribute('aria-busy');
  }
  var initialReason = new URLSearchParams(location.search).get('reason');
  var reasonCopy = loginReasonMessage(initialReason);
  if (reasonCopy) errEl.textContent = reasonCopy;
  btn.addEventListener('click', doLogin);
  document.addEventListener('keydown', function(e){ if(e.key === 'Enter') doLogin(); });
  themeToggleBtn && themeToggleBtn.addEventListener('click', function(e) {
    e.preventDefault();
    toggleTheme();
  });
  syncThemeWithSystem();
  if (systemThemeQuery) {
    if (systemThemeQuery.addEventListener) systemThemeQuery.addEventListener('change', syncThemeWithSystem);
    else if (systemThemeQuery.addListener) systemThemeQuery.addListener(syncThemeWithSystem);
  }
  window.addEventListener('focus', syncThemeWithSystem);
  window.addEventListener('pageshow', function(event) {
    syncThemeWithSystem();
    if (event.persisted) showHeroMotto();
  });
})();
</script>
