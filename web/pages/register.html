<!doctype html>
<html lang="zh-CN" data-theme>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2d6a5f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="EchoGallery">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title id="register-page-title"></title>
    <link rel="manifest" href="/manifest.webmanifest?v={{ASSET_VERSION}}">
    <link rel="icon" href="/static/pwa-icon.png?v={{ASSET_VERSION}}" type="image/png">
    <link rel="apple-touch-icon" href="/static/pwa-icon.png?v={{ASSET_VERSION}}">
    <link rel="stylesheet" href="/pages/common.css?v={{ASSET_VERSION}}">
    <link rel="stylesheet" href="/pages/app.css?v={{ASSET_VERSION}}">
    <link rel="stylesheet" href="/pages/login.css?v={{ASSET_VERSION}}">
    <script src="/static/i18n.js?v={{ASSET_VERSION}}"></script>
    <script src="/static/pwa.js?v={{ASSET_VERSION}}" defer></script>
  </head>
  <body class="register-page">
    <script>
  (function(){
    var systemThemeQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    function syncThemeWithSystem() {
      document.documentElement.dataset.theme = systemThemeQuery && systemThemeQuery.matches ? 'dark' : 'light';
    }
    syncThemeWithSystem();
    if (systemThemeQuery) {
      if (systemThemeQuery.addEventListener) systemThemeQuery.addEventListener('change', syncThemeWithSystem);
      else if (systemThemeQuery.addListener) systemThemeQuery.addListener(syncThemeWithSystem);
    }
    window.addEventListener('focus', syncThemeWithSystem);
    window.addEventListener('pageshow', syncThemeWithSystem);
  })();
</script>
    <script>
  (function() {
    function blockViewportZoom(event) { event.preventDefault(); }
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function(type) {
      document.addEventListener(type, blockViewportZoom, { passive: false });
    });
    document.addEventListener('touchmove', function(event) {
      if (event.touches && event.touches.length > 1) event.preventDefault();
    }, { passive: false });
    document.addEventListener('dblclick', function(event) {
      if (event.target.closest('.register-page, .timeline-order-btn')) event.preventDefault();
    }, { passive: false });
    document.addEventListener('wheel', function(event) {
      if (event.ctrlKey) event.preventDefault();
    }, { passive: false });
  })();
</script>
    <a class="timeline-order-btn" id="register-back-btn" href="/login" aria-label="" title="">
      <svg data-icon-source width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><use href="/static/svg/back.svg#back-icon"></use></svg>
    </a>
    <main class="auth-screen">
      <section class="auth-stage" aria-hidden="true"></section>
      <section class="auth-pane" aria-label="" id="register-auth-pane">
        <div class="auth-brand">
          <img src="/static/pwa-icon.png?v={{ASSET_VERSION}}" alt="">
          <p><strong id="register-form-title"></strong></p>
        </div>
        <div class="auth-fields">
          <div class="auth-field">
            <label for="username" id="register-username-label"></label>
            <input id="username" type="text"
              autocomplete="username" placeholder="">
          </div>
          <div class="auth-field">
            <label for="password" id="register-password-label"></label>
            <input id="password" type="password"
              autocomplete="new-password" placeholder="">
          </div>
          <div class="auth-field">
            <label for="confirm-password" id="register-confirm-label"></label>
            <input id="confirm-password" type="password"
              autocomplete="new-password" placeholder="">
          </div>
        </div>
        <div class="form-group register-role-group">
            <label class="register-role-toggle" for="register-visitor-toggle">
              <span class="register-role-copy">
                <strong id="register-role-title"></strong>
                <small id="register-role-hint"></small>
                <em class="register-role-state" id="register-role-state"></em>
              </span>
              <span class="register-role-switch-wrap">
                <input class="register-role-input" id="register-visitor-toggle" type="checkbox" checked>
                <span class="register-role-switch" aria-hidden="true"></span>
              </span>
            </label>
            <p class="register-admin-note" id="register-admin-note" hidden></p>
        </div>
        <button class="btn btn-primary login-submit"
            id="register-btn"></button>
        <a class="login-secondary-link" href="/login"></a>
        <div class="login-error" id="register-error"></div>
      </section>
    </main>
    <div class="auth-dialog-backdrop" id="register-admin-modal" hidden>
      <div class="auth-dialog-card" role="dialog" aria-modal="true" aria-labelledby="register-admin-modal-title">
        <div class="auth-dialog-head">
          <strong id="register-admin-modal-title"></strong>
          <p id="register-admin-modal-copy"></p>
        </div>
        <div class="form-group">
          <label class="form-label" for="register-admin-username" id="register-admin-username-label"></label>
          <input class="input" id="register-admin-username" type="text" autocomplete="username" placeholder="">
        </div>
        <div class="form-group">
          <label class="form-label" for="register-admin-password" id="register-admin-password-label"></label>
          <input class="input" id="register-admin-password" type="password" autocomplete="current-password" placeholder="">
        </div>
        <div class="auth-dialog-actions">
          <button class="btn" id="register-admin-cancel" type="button"></button>
          <button class="btn btn-primary" id="register-admin-confirm" type="button"></button>
        </div>
        <div class="login-error" id="register-admin-error"></div>
      </div>
    </div>
<script>
(function() {

  function applyCopy(remote) {
    var copy = remote || {};
    document.title = (copy.pageTitle || '').replace(/EchoGallery/g, window.__GALLERY_NAME__ || 'EchoGallery');
    var map = {
      'register-form-title': String(copy.formTitle || '').replace(/EchoGallery/g, window.__GALLERY_NAME__ || 'EchoGallery'),
      'register-username-label': copy.usernameLabel,
      'register-password-label': copy.passwordLabel,
      'register-confirm-label': copy.confirmLabel,
      'register-role-title': copy.visitorRoleTitle,
      'register-role-hint': copy.visitorRoleHint,
      'register-admin-modal-title': copy.adminModalTitle,
      'register-admin-modal-copy': copy.adminModalCopy,
      'register-admin-username-label': copy.adminUsernameLabel,
      'register-admin-password-label': copy.adminPasswordLabel,
      'register-admin-confirm': copy.adminConfirm,
      'register-admin-cancel': copy.adminCancel
    };
    Object.keys(map).forEach(function(id) {
      var node = document.getElementById(id);
      if (node && typeof map[id] === 'string' && map[id]) node.textContent = map[id];
    });
    var pane = document.getElementById('register-auth-pane');
    if (pane && copy.paneLabel) pane.setAttribute('aria-label', copy.paneLabel);
    var note = document.getElementById('register-admin-note');
    if (note && copy.adminNote) note.textContent = copy.adminNote;
    var username = document.getElementById('username');
    if (username && copy.usernamePlaceholder) username.placeholder = copy.usernamePlaceholder;
    var password = document.getElementById('password');
    if (password && copy.passwordPlaceholder) password.placeholder = copy.passwordPlaceholder;
    var confirm = document.getElementById('confirm-password');
    if (confirm && copy.confirmPlaceholder) confirm.placeholder = copy.confirmPlaceholder;
    var adminUsername = document.getElementById('register-admin-username');
    if (adminUsername && copy.adminUsernamePlaceholder) adminUsername.placeholder = copy.adminUsernamePlaceholder;
    var adminPassword = document.getElementById('register-admin-password');
    if (adminPassword && copy.adminPasswordPlaceholder) adminPassword.placeholder = copy.adminPasswordPlaceholder;
    var loginLink = document.querySelector('.login-secondary-link');
    if (loginLink && copy.loginLink) loginLink.textContent = copy.loginLink;
    var backButton = document.getElementById('register-back-btn');
    if (backButton) {
      backButton.setAttribute('aria-label', copy.backLabel || '');
      backButton.setAttribute('title', copy.backLabel || '');
    }
    return copy;
  }
  var btn = document.getElementById('register-btn');
  var errEl = document.getElementById('register-error');
  var visitorToggle = document.getElementById('register-visitor-toggle');
  var roleTitle = document.getElementById('register-role-title');
  var roleHint = document.getElementById('register-role-hint');
  var roleState = document.getElementById('register-role-state');
  var adminNote = document.getElementById('register-admin-note');
  var modal = document.getElementById('register-admin-modal');
  var adminConfirmBtn = document.getElementById('register-admin-confirm');
  var adminCancelBtn = document.getElementById('register-admin-cancel');
  var adminErrEl = document.getElementById('register-admin-error');
  var copy = {};

  function responseError(payload, fallback) {
    var localized = payload && payload.error_key && window.EchoGalleryI18n.text(payload.error_key);
    return localized || (payload && payload.error) || fallback || '';
  }

  function isVisitorMode() {
    return !!(visitorToggle && visitorToggle.checked);
  }

  function syncRoleMode() {
    if (!copy.visitorRoleTitle) return;
    if (isVisitorMode()) {
      if (roleTitle) roleTitle.textContent = copy.visitorRoleTitle || '';
      if (roleHint) roleHint.textContent = copy.visitorRoleHint || '';
      if (roleState) roleState.textContent = (copy.roleStatePrefix || '') + (copy.visitorRoleTitle || '');
      if (adminNote) adminNote.hidden = true;
      closeAdminModal();
      btn.textContent = copy.visitorSubmit || '';
      return;
    }
    if (roleTitle) roleTitle.textContent = copy.adminRoleTitle || '';
    if (roleHint) roleHint.textContent = copy.adminRoleHint || '';
    if (roleState) roleState.textContent = (copy.roleStatePrefix || '') + (copy.adminRoleTitle || '');
    if (adminNote) adminNote.hidden = false;
    btn.textContent = copy.adminSubmit || '';
  }

  function openAdminModal() {
    if (!modal) return;
    adminErrEl.textContent = '';
    modal.hidden = false;
    document.body.classList.add('dialog-open');
  }

  function closeAdminModal() {
    if (!modal) return;
    modal.hidden = true;
    document.body.classList.remove('dialog-open');
    adminErrEl.textContent = '';
  }

  var copyReady = window.EchoGalleryI18n.load()
    .then(function (catalog) {
      if (catalog && catalog.pages && catalog.pages.register) {
        copy = applyCopy(catalog.pages.register);
        syncRoleMode();
      }
    })
    .catch(function () { return copy; });
  async function doRegister(withAdminAuth) {
    await copyReady;
    var u = document.getElementById('username').value.trim();
    var p = document.getElementById('password').value;
    var c = document.getElementById('confirm-password').value;
    var role = isVisitorMode() ? 'visitor' : 'admin';
    if (!u || !p || !c) { errEl.textContent = copy.errors && copy.errors.missingFields || ''; return; }
    if (p !== c) { errEl.textContent = copy.errors && copy.errors.passwordMismatch || ''; return; }
    if (role === 'admin' && !withAdminAuth) {
      openAdminModal();
      return;
    }
    var adminUsername = document.getElementById('register-admin-username').value.trim();
    var adminPassword = document.getElementById('register-admin-password').value;
    if (role === 'admin' && (!adminUsername || !adminPassword)) {
      adminErrEl.textContent = copy.errors && copy.errors.missingAdminFields || '';
      return;
    }
    errEl.textContent = '';
    adminErrEl.textContent = '';
    btn.disabled = true;
    var submittingSuffix = copy.submittingSuffix || '';
    btn.textContent = role === 'admin'
      ? (copy.adminSubmit || '') + submittingSuffix
      : (copy.visitorSubmit || '') + submittingSuffix;
    if (adminConfirmBtn) {
      adminConfirmBtn.disabled = true;
      adminConfirmBtn.textContent = (copy.adminConfirm || '') + submittingSuffix;
    }
    try {
      var r = await fetch('/api/auth/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          username: u,
          password: p,
          confirm_password: c,
          role: role,
          admin_username: adminUsername,
          admin_password: adminPassword
        })
      });
      if (r.ok) { location.href = '/login'; return; }
      var d = await r.json();
      if (role === 'admin') adminErrEl.textContent = responseError(d, copy.errors && copy.errors.failed);
      else errEl.textContent = responseError(d, copy.errors && copy.errors.failed);
    } catch(e) {
      if (role === 'admin') adminErrEl.textContent = copy.errors && copy.errors.network || '';
      else errEl.textContent = copy.errors && copy.errors.network || '';
    }
    btn.disabled = false;
    if (adminConfirmBtn) {
      adminConfirmBtn.disabled = false;
      adminConfirmBtn.textContent = copy.adminConfirm || '';
    }
    syncRoleMode();
  }
  if (visitorToggle) visitorToggle.addEventListener('change', syncRoleMode);
  if (modal) {
    modal.addEventListener('click', function (event) {
      if (event.target === modal) closeAdminModal();
    });
  }
  if (adminCancelBtn) adminCancelBtn.addEventListener('click', closeAdminModal);
  if (adminConfirmBtn) adminConfirmBtn.addEventListener('click', function () { doRegister(true); });
  btn.addEventListener('click', function () { doRegister(false); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && modal && !modal.hidden) {
      e.preventDefault();
      closeAdminModal();
      return;
    }
    if (e.key !== 'Enter') return;
    if (modal && !modal.hidden) {
      doRegister(true);
      return;
    }
    doRegister(false);
  });
})();
</script>
  </body>
</html>
